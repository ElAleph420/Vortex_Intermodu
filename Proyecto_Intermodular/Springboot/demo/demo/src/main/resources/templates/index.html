<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex - Planes</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
</head>
<body>
    <header>
        <div class="lang-selector">
            <a href="/" class="lang-link lang-active">Español</a>
            <span class="lang-sep">|</span>
            <a href="/en" class="lang-link">English</a>
        </div>
        <a href="contacto.html" class="contacto">Contáctanos</a>
    </header>

    <main class="planes-container">
        <div class="plan" onclick="window.location.href='/auth?plan=free'">
            <h2 class="plan-titulo">PLAN GRATUITO</h2>
            <div class="prestaciones">Prestaciones</div>
            <div class="separador"></div>
            <p class="precio">Precio</p>
        </div>

        <div class="plan" onclick="window.location.href='/auth?plan=standard'">
            <h2 class="plan-titulo">PLAN ESTÁNDAR</h2>
            <div class="prestaciones">Prestaciones</div>
            <div class="separador"></div>
            <p class="precio">Precio</p>
        </div>

        <div class="plan" onclick="window.location.href='/auth?plan=premium'">
            <h2 class="plan-titulo">PLAN PREMIUM</h2>
            <div class="prestaciones">Prestaciones</div>
            <div class="separador"></div>
            <p class="precio">Precio</p>
        </div>
    </main>

    <footer>
        En Vortex nos preocupamos por tu seguridad
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex - Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

<header>
    <img src="/logo.png" alt="Vortex" class="logo">
    <div class="header-right">
        <span class="usuario-info" sec:authentication="name">usuario@email.com</span>
        <form th:action="@{/logout}" method="post" style="margin:0">
            <button type="submit" class="btn-logout">Cerrar sesión</button>
        </form>
    </div>
</header>

<div class="main-content">

    <!-- BLOQUE 1: GENERADOR -->
    <div>
        <p class="seccion-titulo">Generador de contraseñas</p>
        <div class="tarjeta">

            <div id="alertaGenerador" class="alerta alerta-error"></div>
            <div id="alertaGuardar"   class="alerta alerta-exito"></div>

            <div class="generador-grid">

                <div class="campo">
                    <label>Longitud</label>
                    <div class="slider-row">
                        <input type="range" id="lonRange" min="4" max="64" value="16"
                               oninput="sincronizar(this.value)">
                        <span class="slider-num" id="sliderValor">16</span>
                        <input type="number" id="lonNum" min="4" max="64" value="16" style="width:75px"
                               oninput="sincronizar(this.value)">
                    </div>
                </div>

                <div class="campo">
                    <label>Palabra obligatoria</label>
                    <input type="text" id="palabra" placeholder="Opcional, ej: arbol">
                </div>

                <div class="campo" style="grid-column:1/-1">
                    <label>Tipos de caracteres</label>
                    <div class="checkboxes-grid">
                        <label class="check-item">
                            <input type="checkbox" id="chkMay" checked> Letras mayúsculas (A-Z)
                        </label>
                        <label class="check-item">
                            <input type="checkbox" id="chkMin" checked> Letras minúsculas (a-z)
                        </label>
                        <label class="check-item">
                            <input type="checkbox" id="chkNum" checked> Números (0-9)
                        </label>
                        <label class="check-item">
                            <input type="checkbox" id="chkEsp"> Caracteres especiales (!@#$%...)
                        </label>
                    </div>
                </div>

                <div class="resultado-box">
                    <span id="resultadoTexto" class="resultado-valor resultado-placeholder">
                        Pulsa «Generar» para crear una contraseña
                    </span>
                    <button class="btn-copiar" id="btnCopiar" onclick="copiar()" style="display:none">Copiar</button>
                </div>

                <div class="botones-generador">
                    <button class="btn btn-primario" onclick="generar()">Generar</button>
                    <button class="btn btn-secundario" onclick="generar()">Regenerar</button>
                </div>

                <div class="guardar-panel">
                    <button class="guardar-toggle" id="guardarToggle" onclick="toggleGuardar()">
                        Guardar esta contraseña en el gestor
                        <span class="flecha">▼</span>
                    </button>
                    <div class="guardar-contenido" id="guardarContenido">
                        <div class="guardar-fila">
                            <div class="campo">
                                <label>Servicio</label>
                                <select id="selServicio">
                                    <option value="">— Sin servicio —</option>
                                </select>
                            </div>
                            <div class="campo">
                                <label>Fecha de expiración</label>
                                <input type="date" id="fechaExp">
                            </div>
                            <button class="btn btn-primario" onclick="guardar()">Guardar</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- BLOQUE 2: GESTOR -->
    <div>
        <p class="seccion-titulo">Mis contraseñas guardadas</p>
        <div class="tarjeta">
            <div class="tabla-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Servicio</th>
                            <th>Contraseña</th>
                            <th>Fecha creación</th>
                            <th>Fecha expiración</th>
                            <th>Estado</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tbodyGestor">
                        <tr><td colspan="6" class="estado-vacio">Cargando…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<footer>
    En Vortex nos preocupamos por tu seguridad
</footer>

<script th:inline="javascript">
/*<![CDATA[*/

document.addEventListener('DOMContentLoaded', () => {
    cargarServicios();
    cargarGestor();
});

function sincronizar(val) {
    document.getElementById('lonRange').value          = val;
    document.getElementById('lonNum').value            = val;
    document.getElementById('sliderValor').textContent = val;
}

async function generar() {
    ocultarAlertas();
    const params = new URLSearchParams({
        longitud:   document.getElementById('lonNum').value,
        mayusculas: document.getElementById('chkMay').checked,
        minusculas: document.getElementById('chkMin').checked,
        numeros:    document.getElementById('chkNum').checked,
        especiales: document.getElementById('chkEsp').checked,
        palabra:    document.getElementById('palabra').value.trim()
    });
    try {
        const res  = await fetch('/api/contrasenya/generar?' + params);
        const data = await res.json();
        if (!res.ok) { mostrarAlerta('alertaGenerador', 'error', data.error || 'Error al generar.'); return; }
        const el = document.getElementById('resultadoTexto');
        el.textContent = data.contrasenya;
        el.classList.remove('resultado-placeholder');
        const btn = document.getElementById('btnCopiar');
        btn.style.display = 'inline-block';
        btn.textContent   = 'Copiar';
        btn.classList.remove('copiado');
    } catch (e) {
        mostrarAlerta('alertaGenerador', 'error', 'Error de red. Inténtalo de nuevo.');
    }
}

function copiar() {
    const val = document.getElementById('resultadoTexto').textContent;
    if (!val || val.includes('Pulsa')) return;
    navigator.clipboard.writeText(val).then(() => {
        const btn = document.getElementById('btnCopiar');
        btn.textContent = '✓ Copiado';
        btn.classList.add('copiado');
        setTimeout(() => { btn.textContent = 'Copiar'; btn.classList.remove('copiado'); }, 2000);
    });
}

function toggleGuardar() {
    document.getElementById('guardarToggle').classList.toggle('abierto');
    document.getElementById('guardarContenido').classList.toggle('visible');
}

async function cargarServicios() {
    try {
        const res  = await fetch('/api/contrasenya/servicios');
        const data = await res.json();
        const sel  = document.getElementById('selServicio');
        data.forEach(s => {
            const opt = document.createElement('option');
            opt.value       = s.idServicio;
            opt.textContent = s.nombre;
            sel.appendChild(opt);
        });
    } catch (e) {}
}

async function guardar() {
    ocultarAlertas();
    const valor = document.getElementById('resultadoTexto').textContent;
    if (!valor || valor.includes('Pulsa')) {
        mostrarAlerta('alertaGenerador', 'error', 'Primero genera una contraseña.');
        return;
    }
    const body = {
        valor:           valor,
        idServicio:      document.getElementById('selServicio').value || null,
        fechaExpiracion: document.getElementById('fechaExp').value    || null
    };
    try {
        const res  = await fetch('/api/contrasenya/guardar', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) { mostrarAlerta('alertaGenerador', 'error', data.error || 'No se pudo guardar.'); return; }
        mostrarAlerta('alertaGuardar', 'exito', '✓ Contraseña guardada correctamente.');
        document.getElementById('guardarToggle').classList.remove('abierto');
        document.getElementById('guardarContenido').classList.remove('visible');
        cargarGestor();
    } catch (e) {
        mostrarAlerta('alertaGenerador', 'error', 'Error de red al guardar.');
    }
}

async function cargarGestor() {
    const tbody = document.getElementById('tbodyGestor');
    try {
        const res  = await fetch('/api/contrasenya/lista');
        const data = await res.json();
        if (!Array.isArray(data) || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="estado-vacio">Aún no tienes contraseñas guardadas. ¡Genera y guarda una!</td></tr>`;
            return;
        }
        tbody.innerHTML = data.map(c => `
            <tr>
                <td>${esc(c.servicio)}</td>
                <td><span class="pwd-valor" title="${esc(c.valor)}">${esc(c.valor)}</span></td>
                <td>${fecha(c.fechaCreacion)}</td>
                <td>${c.fechaExpiracion ? fecha(c.fechaExpiracion) : (c.fechaCaducidadGestor ? fecha(c.fechaCaducidadGestor) + ' *' : '—')}</td>
                <td>${badge(c.estado)}</td>
                <td><button class="btn-copiar" onclick="navigator.clipboard.writeText('${esc(c.valor)}')">Copiar</button></td>
            </tr>`).join('');
    } catch (e) {
        tbody.innerHTML = `<tr><td colspan="6" class="estado-vacio">Error al cargar las contraseñas.</td></tr>`;
    }
}

function badge(estado) {
    const m = {
        'activa':        ['badge-activa',   'Activa'],
        'expira-pronto': ['badge-pronto',   'Expira pronto'],
        'expira-hoy':    ['badge-hoy',      '¡Expira hoy!'],
        'expirada':      ['badge-expirada', 'Expirada'],
        'gestor-caduca': ['badge-gestorcaduca', 'Caduca pronto']
    };
    const [cls, txt] = m[estado] || ['badge-activa', estado];
    return `<span class="badge ${cls}">${txt}</span>`;
}

function fecha(iso) {
    if (!iso) return '—';
    if (Array.isArray(iso)) {
        const [y, m, d] = iso;
        return `${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y}`;
    }
    return new Date(iso).toLocaleDateString('es-ES');
}

function esc(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function mostrarAlerta(id, tipo, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = `alerta alerta-${tipo} visible`;
    if (tipo === 'exito') setTimeout(() => el.classList.remove('visible'), 4000);
}

function ocultarAlertas() {
    document.querySelectorAll('.alerta').forEach(el => el.classList.remove('visible'));
}

/*]]>*/
</script>

</body>
</html>

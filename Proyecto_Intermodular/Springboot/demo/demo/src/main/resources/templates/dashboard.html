<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Garamond', serif;
            background-color: #2c3e50;
            padding: 0;
            margin: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 60px;
            background-color: #1a252f;
        }

        .logo {
            width: 120px;
            height: auto;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .usuario-info {
            font-size: 16px;
            color: #e8e8d8;
            font-style: italic;
        }

        .btn-logout {
            font-size: 18px;
            color: #e8e8d8;
            text-decoration: none;
            font-weight: bold;
            background: none;
            border: 2px solid #e8e8d8;
            padding: 8px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Georgia', 'Garamond', serif;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            color: #1a252f;
            background-color: #e8e8d8;
        }

        .main-content {
            padding: 50px 60px;
            display: flex;
            flex-direction: column;
            gap: 50px;
        }

        .seccion-titulo {
            font-size: 22px;
            font-weight: bold;
            color: #e8e8d8;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
            border-bottom: 2px solid #e8e8d8;
            padding-bottom: 10px;
        }

        .tarjeta {
            background-color: #e8e8d8;
            border: 3px solid #1a252f;
            border-radius: 25px;
            padding: 40px 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* =====================================================
           GENERADOR
        ===================================================== */
        .generador-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px 50px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .campo label {
            font-size: 15px;
            font-weight: bold;
            color: #1a252f;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .campo input[type="number"],
        .campo input[type="text"],
        .campo input[type="date"],
        .campo select {
            background-color: #fff;
            border: 2px solid #1a252f;
            border-radius: 10px;
            padding: 10px 15px;
            font-family: 'Georgia', 'Garamond', serif;
            font-size: 16px;
            color: #1a252f;
            transition: border-color 0.3s;
        }

        .campo input:focus,
        .campo select:focus {
            outline: none;
            border-color: #c9a961;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            height: 5px;
            border-radius: 3px;
            background: #1a252f;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #c9a961;
            cursor: pointer;
            border: 2px solid #1a252f;
        }

        .slider-num {
            font-size: 22px;
            font-weight: bold;
            color: #1a252f;
            min-width: 35px;
            text-align: center;
        }

        .checkboxes-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 16px;
            color: #1a252f;
            font-style: italic;
        }

        .check-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #1a252f;
            cursor: pointer;
            flex-shrink: 0;
        }

        .resultado-box {
            grid-column: 1 / -1;
            background-color: #1a252f;
            border: 2px solid #1a252f;
            border-radius: 15px;
            padding: 18px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            min-height: 60px;
        }

        .resultado-valor {
            flex: 1;
            font-family: 'Courier New', monospace;
            font-size: 20px;
            color: #e8e8d8;
            letter-spacing: 0.1em;
            word-break: break-all;
        }

        .resultado-placeholder {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 16px;
            color: #8fa0a8;
        }

        .btn-copiar {
            background: none;
            border: 2px solid #e8e8d8;
            color: #e8e8d8;
            padding: 6px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Georgia', serif;
            font-size: 14px;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .btn-copiar:hover { background-color: #e8e8d8; color: #1a252f; }
        .btn-copiar.copiado { border-color: #4caf7d; color: #4caf7d; }

        .botones-generador {
            grid-column: 1 / -1;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            font-family: 'Georgia', 'Garamond', serif;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 12px 30px;
            border-radius: 12px;
            cursor: pointer;
            border: 3px solid #1a252f;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-primario {
            background-color: #1a252f;
            color: #e8e8d8;
        }

        .btn-primario:hover {
            background-color: #2c3e50;
            border-color: #c9a961;
        }

        .btn-secundario {
            background-color: transparent;
            color: #1a252f;
        }

        .btn-secundario:hover {
            background-color: #1a252f;
            color: #e8e8d8;
        }

        .guardar-panel {
            grid-column: 1 / -1;
            border: 2px solid #1a252f;
            border-radius: 15px;
            overflow: hidden;
        }

        .guardar-toggle {
            width: 100%;
            background-color: #2c3e50;
            border: none;
            color: #e8e8d8;
            padding: 14px 25px;
            text-align: left;
            font-family: 'Georgia', serif;
            font-size: 16px;
            font-style: italic;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.3s;
        }

        .guardar-toggle:hover { background-color: #1a252f; }
        .guardar-toggle .flecha { transition: transform 0.25s; }
        .guardar-toggle.abierto .flecha { transform: rotate(180deg); }

        .guardar-contenido {
            display: none;
            padding: 25px;
            background-color: #f0f0e0;
            border-top: 2px solid #1a252f;
        }

        .guardar-contenido.visible { display: block; }

        .guardar-fila {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 20px;
            align-items: flex-end;
        }

        .alerta {
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 20px;
            display: none;
            font-style: italic;
        }

        .alerta-error { background-color: #f8d7da; border: 2px solid #e84b4b; color: #8b0000; }
        .alerta-exito { background-color: #d4edda; border: 2px solid #4caf7d; color: #155724; }
        .alerta.visible { display: block; }

        /* =====================================================
           GESTOR
        ===================================================== */
        .tabla-wrapper { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 16px;
        }

        thead th {
            background-color: #1a252f;
            color: #e8e8d8;
            padding: 14px 20px;
            text-align: left;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        thead th:first-child { border-radius: 10px 0 0 0; }
        thead th:last-child  { border-radius: 0 10px 0 0; }

        tbody tr { border-bottom: 1px solid #c9c9ba; transition: background 0.2s; }
        tbody tr:hover { background-color: #f0f0e0; }
        tbody td { padding: 14px 20px; color: #2c3e50; vertical-align: middle; }

        .pwd-valor {
            font-family: 'Courier New', monospace;
            font-size: 15px;
            color: #1a252f;
            font-weight: bold;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: block;
        }

        .badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .badge-activa       { background-color: #d4edda; color: #155724; border: 1px solid #4caf7d; }
        .badge-pronto       { background-color: #fff3cd; color: #856404; border: 1px solid #e8b84b; }
        .badge-hoy          { background-color: #ffe5d0; color: #7d3c00; border: 1px solid #e87c4b; }
        .badge-expirada     { background-color: #f8d7da; color: #8b0000; border: 1px solid #e84b4b; }
        .badge-gestorcaduca { background-color: #fff3cd; color: #856404; border: 1px solid #e8b84b; }

        .estado-vacio {
            text-align: center;
            padding: 40px;
            color: #2c3e50;
            font-style: italic;
            font-size: 17px;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            font-size: 20px;
            font-weight: bold;
            color: #e8e8d8;
            letter-spacing: 0.5px;
            background-color: #1a252f;
            margin-top: 20px;
        }

        @media (max-width: 700px) {
            .main-content { padding: 30px 20px; }
            .generador-grid { grid-template-columns: 1fr; }
            .checkboxes-grid { grid-template-columns: 1fr; }
            .guardar-fila { grid-template-columns: 1fr; }
            header { padding: 20px 25px; }
        }
    </style>
</head>
<body>

<header>
    <img src="/logo.png" alt="Vortex" class="logo">
    <div class="header-right">
        <span class="usuario-info" sec:authentication="name">usuario@email.com</span>
        <form th:action="@{/logout}" method="post" style="margin:0">
            <button type="submit" class="btn-logout">Cerrar sesión</button>
        </form>
    </div>
</header>

<div class="main-content">

    <!-- BLOQUE 1: GENERADOR -->
    <div>
        <p class="seccion-titulo">Generador de contraseñas</p>
        <div class="tarjeta">

            <div id="alertaGenerador" class="alerta alerta-error"></div>
            <div id="alertaGuardar"   class="alerta alerta-exito"></div>

            <div class="generador-grid">

                <div class="campo">
                    <label>Longitud</label>
                    <div class="slider-row">
                        <input type="range" id="lonRange" min="4" max="64" value="16"
                               oninput="sincronizar(this.value)">
                        <span class="slider-num" id="sliderValor">16</span>
                        <input type="number" id="lonNum" min="4" max="64" value="16" style="width:75px"
                               oninput="sincronizar(this.value)">
                    </div>
                </div>

                <div class="campo">
                    <label>Palabra obligatoria</label>
                    <input type="text" id="palabra" placeholder="Opcional, ej: arbol">
                </div>

                <div class="campo" style="grid-column:1/-1">
                    <label>Tipos de caracteres</label>
                    <div class="checkboxes-grid">
                        <label class="check-item">
                            <input type="checkbox" id="chkMay" checked> Letras mayúsculas (A-Z)
                        </label>
                        <label class="check-item">
                            <input type="checkbox" id="chkMin" checked> Letras minúsculas (a-z)
                        </label>
                        <label class="check-item">
                            <input type="checkbox" id="chkNum" checked> Números (0-9)
                        </label>
                        <label class="check-item">
                            <input type="checkbox" id="chkEsp"> Caracteres especiales (!@#$%...)
                        </label>
                    </div>
                </div>

                <div class="resultado-box">
                    <span id="resultadoTexto" class="resultado-valor resultado-placeholder">
                        Pulsa «Generar» para crear una contraseña
                    </span>
                    <button class="btn-copiar" id="btnCopiar" onclick="copiar()" style="display:none">Copiar</button>
                </div>

                <div class="botones-generador">
                    <button class="btn btn-primario" onclick="generar()">Generar</button>
                    <button class="btn btn-secundario" onclick="generar()">Regenerar</button>
                </div>

                <div class="guardar-panel">
                    <button class="guardar-toggle" id="guardarToggle" onclick="toggleGuardar()">
                        Guardar esta contraseña en el gestor
                        <span class="flecha">▼</span>
                    </button>
                    <div class="guardar-contenido" id="guardarContenido">
                        <div class="guardar-fila">
                            <div class="campo">
                                <label>Servicio</label>
                                <select id="selServicio">
                                    <option value="">— Sin servicio —</option>
                                </select>
                            </div>
                            <div class="campo">
                                <label>Fecha de expiración</label>
                                <input type="date" id="fechaExp">
                            </div>
                            <button class="btn btn-primario" onclick="guardar()">Guardar</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- BLOQUE 2: GESTOR -->
    <div>
        <p class="seccion-titulo">Mis contraseñas guardadas</p>
        <div class="tarjeta">
            <div class="tabla-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Servicio</th>
                            <th>Contraseña</th>
                            <th>Fecha creación</th>
                            <th>Fecha expiración</th>
                            <th>Estado</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tbodyGestor">
                        <tr><td colspan="6" class="estado-vacio">Cargando…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<footer>
    En Vortex nos preocupamos por tu seguridad
</footer>

<script th:inline="javascript">
/*<![CDATA[*/

document.addEventListener('DOMContentLoaded', () => {
    cargarServicios();
    cargarGestor();
});

function sincronizar(val) {
    document.getElementById('lonRange').value          = val;
    document.getElementById('lonNum').value            = val;
    document.getElementById('sliderValor').textContent = val;
}

async function generar() {
    ocultarAlertas();
    const params = new URLSearchParams({
        longitud:   document.getElementById('lonNum').value,
        mayusculas: document.getElementById('chkMay').checked,
        minusculas: document.getElementById('chkMin').checked,
        numeros:    document.getElementById('chkNum').checked,
        especiales: document.getElementById('chkEsp').checked,
        palabra:    document.getElementById('palabra').value.trim()
    });
    try {
        const res  = await fetch('/api/contrasenya/generar?' + params);
        const data = await res.json();
        if (!res.ok) { mostrarAlerta('alertaGenerador', 'error', data.error || 'Error al generar.'); return; }
        const el = document.getElementById('resultadoTexto');
        el.textContent = data.contrasenya;
        el.classList.remove('resultado-placeholder');
        const btn = document.getElementById('btnCopiar');
        btn.style.display = 'inline-block';
        btn.textContent   = 'Copiar';
        btn.classList.remove('copiado');
    } catch (e) {
        mostrarAlerta('alertaGenerador', 'error', 'Error de red. Inténtalo de nuevo.');
    }
}

function copiar() {
    const val = document.getElementById('resultadoTexto').textContent;
    if (!val || val.includes('Pulsa')) return;
    navigator.clipboard.writeText(val).then(() => {
        const btn = document.getElementById('btnCopiar');
        btn.textContent = '✓ Copiado';
        btn.classList.add('copiado');
        setTimeout(() => { btn.textContent = 'Copiar'; btn.classList.remove('copiado'); }, 2000);
    });
}

function toggleGuardar() {
    document.getElementById('guardarToggle').classList.toggle('abierto');
    document.getElementById('guardarContenido').classList.toggle('visible');
}

async function cargarServicios() {
    try {
        const res  = await fetch('/api/contrasenya/servicios');
        const data = await res.json();
        const sel  = document.getElementById('selServicio');
        data.forEach(s => {
            const opt = document.createElement('option');
            opt.value       = s.idServicio;
            opt.textContent = s.nombre;
            sel.appendChild(opt);
        });
    } catch (e) {}
}

async function guardar() {
    ocultarAlertas();
    const valor = document.getElementById('resultadoTexto').textContent;
    if (!valor || valor.includes('Pulsa')) {
        mostrarAlerta('alertaGenerador', 'error', 'Primero genera una contraseña.');
        return;
    }
    const body = {
        valor:           valor,
        idServicio:      document.getElementById('selServicio').value || null,
        fechaExpiracion: document.getElementById('fechaExp').value    || null
    };
    try {
        const res  = await fetch('/api/contrasenya/guardar', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) { mostrarAlerta('alertaGenerador', 'error', data.error || 'No se pudo guardar.'); return; }
        mostrarAlerta('alertaGuardar', 'exito', '✓ Contraseña guardada correctamente.');
        document.getElementById('guardarToggle').classList.remove('abierto');
        document.getElementById('guardarContenido').classList.remove('visible');
        cargarGestor();
    } catch (e) {
        mostrarAlerta('alertaGenerador', 'error', 'Error de red al guardar.');
    }
}

async function cargarGestor() {
    const tbody = document.getElementById('tbodyGestor');
    try {
        const res  = await fetch('/api/contrasenya/lista');
        const data = await res.json();
        if (!Array.isArray(data) || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="estado-vacio">Aún no tienes contraseñas guardadas. ¡Genera y guarda una!</td></tr>`;
            return;
        }
        tbody.innerHTML = data.map(c => `
            <tr>
                <td>${esc(c.servicio)}</td>
                <td><span class="pwd-valor" title="${esc(c.valor)}">${esc(c.valor)}</span></td>
                <td>${fecha(c.fechaCreacion)}</td>
                <td>${c.fechaExpiracion ? fecha(c.fechaExpiracion) : (c.fechaCaducidadGestor ? fecha(c.fechaCaducidadGestor) + ' *' : '—')}</td>
                <td>${badge(c.estado)}</td>
                <td><button class="btn-copiar" onclick="navigator.clipboard.writeText('${esc(c.valor)}')">Copiar</button></td>
            </tr>`).join('');
    } catch (e) {
        tbody.innerHTML = `<tr><td colspan="6" class="estado-vacio">Error al cargar las contraseñas.</td></tr>`;
    }
}

function badge(estado) {
    const m = {
        'activa':        ['badge-activa',   'Activa'],
        'expira-pronto': ['badge-pronto',   'Expira pronto'],
        'expira-hoy':    ['badge-hoy',      '¡Expira hoy!'],
        'expirada':      ['badge-expirada', 'Expirada'],
        'gestor-caduca': ['badge-gestorcaduca', 'Caduca pronto']
    };
    const [cls, txt] = m[estado] || ['badge-activa', estado];
    return `<span class="badge ${cls}">${txt}</span>`;
}

function fecha(iso) {
    if (!iso) return '—';
    if (Array.isArray(iso)) {
        const [y, m, d] = iso;
        return `${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y}`;
    }
    return new Date(iso).toLocaleDateString('es-ES');
}

function esc(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function mostrarAlerta(id, tipo, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = `alerta alerta-${tipo} visible`;
    if (tipo === 'exito') setTimeout(() => el.classList.remove('visible'), 4000);
}

function ocultarAlertas() {
    document.querySelectorAll('.alerta').forEach(el => el.classList.remove('visible'));
}

/*]]>*/
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex - Iniciar Sesión</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
    <header>
        <img src="/logo.png" alt="" class="logo">
        <a href="/" class="volver">← Volver a planes</a>
    </header>
    <main class="contenedor">
        <div class="tarjeta">
            <h2>Iniciar Sesión</h2>
            <div class="separador"></div>
            <form th:action="@{/login}" method="post">
                <label>Email</label>
                <input type="text" name="username" placeholder="tu@email.com" required/>
                <label>Contraseña</label>
                <input type="password" name="password" placeholder="Tu contraseña" required/>
                <button type="submit">Entrar</button>
                <p class="error" th:if="${param.error}">Credenciales incorrectas. Inténtalo de nuevo.</p>
            </form>
        </div>
    </main>
    <footer>En Vortex nos preocupamos por tu seguridad</footer>
</body>
</html>

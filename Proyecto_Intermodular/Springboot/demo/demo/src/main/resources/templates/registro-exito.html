<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vortex - Registro completado</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Georgia', 'Garamond', serif; background-color: #2c3e50; min-height: 100vh; display: flex; flex-direction: column; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 30px 60px; background-color: #1a252f; }
        .logo { width: 120px; height: auto; }
        .contenedor { flex: 1; display: flex; justify-content: center; align-items: center; padding: 60px 20px; }
        .tarjeta { background-color: #e8e8d8; border: 3px solid #1a252f; border-radius: 25px; padding: 50px 40px; width: 420px; text-align: center; }
        h2 { font-size: 24px; color: #1a252f; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }
        .separador { width: 100%; height: 2px; background: linear-gradient(to right, transparent, #1a252f 20%, #1a252f 80%, transparent); margin-bottom: 30px; }
        p { font-size: 15px; color: #2c3e50; margin-bottom: 16px; line-height: 1.8; }
        .contrasena { font-size: 32px; font-weight: bold; color: #1a252f; letter-spacing: 8px; background-color: #f0f0e0; border: 2px solid #1a252f; border-radius: 10px; padding: 16px 30px; display: inline-block; margin: 20px 0; }
        .aviso { font-size: 13px; color: #856404; font-style: italic; margin-bottom: 30px; }
        a { display: inline-block; padding: 14px 40px; background-color: #1a252f; color: #e8e8d8; border-radius: 10px; text-decoration: none; font-size: 15px; text-transform: uppercase; letter-spacing: 1px; transition: background 0.3s; }
        a:hover { background-color: #2c3e50; }
        footer { text-align: center; padding: 30px 20px; font-size: 18px; font-weight: bold; color: #e8e8d8; background-color: #1a252f; }
    </style>
</head>
<body>
    <header>
        <img src="/logo.png" alt="" class="logo">
    </header>
    <main class="contenedor">
        <div class="tarjeta">
            <h2>¡Cuenta creada!</h2>
            <div class="separador"></div>
            <p>Tu cuenta ha sido creada con el email:</p>
            <p><strong th:text="${email}"></strong></p>
            <p>Tu contraseña de acceso es:</p>
            <div class="contrasena" th:text="${contrasena}"></div>
            <p class="aviso">⚠ Anota esta contraseña. No podrás recuperarla después.</p>
            <a href="/login">Iniciar sesión</a>
        </div>
    </main>
    <footer>En Vortex nos preocupamos por tu seguridad</footer>
</body>
</html>

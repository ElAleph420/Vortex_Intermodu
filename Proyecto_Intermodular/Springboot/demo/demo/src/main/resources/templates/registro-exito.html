<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex - Registro completado</title>
    <link rel="stylesheet" th:href="@{/css/registro-exito.css}">
</head>
<body>
    <header>
        <img src="/logo.png" alt="" class="logo">
    </header>
    <main class="contenedor">
        <div class="tarjeta">
            <h2>¡Cuenta creada!</h2>
            <div class="separador"></div>
            <p>Tu cuenta ha sido creada con el email:</p>
            <p><strong th:text="${email}"></strong></p>
            <p>Tu contraseña de acceso es:</p>
            <div class="contrasena" th:text="${contrasena}"></div>
            <p class="aviso">⚠ Anota esta contraseña. No podrás recuperarla después.</p>
            <a href="/login">Iniciar sesión</a>
        </div>
    </main>
    <footer>En Vortex nos preocupamos por tu seguridad</footer>
</body>
</html>

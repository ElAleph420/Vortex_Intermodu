<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vortex - Registro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Georgia', 'Garamond', serif; background-color: #2c3e50; min-height: 100vh; display: flex; flex-direction: column; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 30px 60px; background-color: #1a252f; }
        .logo { width: 120px; height: auto; }
        .volver { font-size: 18px; color: #e8e8d8; text-decoration: none; font-weight: bold; }
        .volver:hover { color: #c9a961; }
        .contenedor { flex: 1; display: flex; justify-content: center; align-items: center; padding: 60px 20px; }
        .tarjeta { background-color: #e8e8d8; border: 3px solid #1a252f; border-radius: 25px; padding: 50px 40px; width: 420px; }
        h2 { font-size: 24px; color: #1a252f; text-transform: uppercase; letter-spacing: 2px; text-align: center; margin-bottom: 30px; }
        .separador { width: 100%; height: 2px; background: linear-gradient(to right, transparent, #1a252f 20%, #1a252f 80%, transparent); margin-bottom: 30px; }
        label { display: block; font-size: 14px; color: #1a252f; margin-bottom: 6px; font-weight: bold; }
        input { width: 100%; padding: 10px 14px; border: 2px solid #1a252f; border-radius: 8px; font-size: 15px; margin-bottom: 20px; background: #f0f0e0; font-family: inherit; }
        input:focus { outline: none; border-color: #c9a961; }
        button { width: 100%; padding: 14px; background-color: #1a252f; color: #e8e8d8; border: none; border-radius: 10px; font-size: 16px; font-family: inherit; cursor: pointer; letter-spacing: 1px; text-transform: uppercase; transition: background 0.3s; }
        button:hover { background-color: #2c3e50; }
        .plan-badge { text-align: center; margin-bottom: 20px; background-color: #1a252f; color: #e8e8d8; padding: 6px 20px; border-radius: 20px; font-size: 13px; display: inline-block; }
        .badge-wrapper { text-align: center; margin-bottom: 20px; }
        footer { text-align: center; padding: 30px 20px; font-size: 18px; font-weight: bold; color: #e8e8d8; background-color: #1a252f; }
    </style>
</head>
<body>
    <header>
        <img src="/logo.png" alt="" class="logo">
        <a th:href="@{/auth(plan=${plan})}" class="volver">← Volver</a>
    </header>
    <main class="contenedor">
        <div class="tarjeta">
            <h2>Crear cuenta</h2>
            <div class="separador"></div>
            <div class="badge-wrapper">
                <span class="plan-badge" th:text="'Plan: ' + ${plan}"></span>
            </div>
            <form th:action="@{/registro/procesar}" method="post">
                <input type="hidden" name="plan" th:value="${plan}"/>
                <label>DNI</label>
                <input type="text" name="dni" placeholder="12345678A" required maxlength="9"/>
                <label>Nombre</label>
                <input type="text" name="nombre" placeholder="Tu nombre" required/>
                <label>Email</label>
                <input type="email" name="email" placeholder="tu@email.com" required/>
                <button type="submit">Crear cuenta</button>
            </form>
        </div>
    </main>
    <footer>En Vortex nos preocupamos por tu seguridad</footer>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex - Registro</title>
    <link rel="stylesheet" th:href="@{/css/registro.css}">
</head>
<body>
    <header>
        <img src="/logo.png" alt="" class="logo">
        <a th:href="@{/auth(plan=${plan})}" class="volver">← Volver</a>
    </header>
    <main class="contenedor">
        <div class="tarjeta">
            <h2>Crear cuenta</h2>
            <div class="separador"></div>
            <div class="badge-wrapper">
                <span class="plan-badge" th:text="'Plan: ' + ${plan}"></span>
            </div>
            <form th:action="@{/registro/procesar}" method="post">
                <input type="hidden" name="plan" th:value="${plan}"/>
                <label>DNI</label>
                <input type="text" name="dni" placeholder="12345678A" required maxlength="9"/>
                <label>Nombre</label>
                <input type="text" name="nombre" placeholder="Tu nombre" required/>
                <label>Email</label>
                <input type="email" name="email" placeholder="tu@email.com" required/>
                <button type="submit">Crear cuenta</button>
            </form>
        </div>
    </main>
    <footer>En Vortex nos preocupamos por tu seguridad</footer>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex - Acceso</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
    <header>
        <img src="/logo.png" alt="" class="logo">
        <a href="/" class="volver">← Volver a planes</a>
    </header>
    <main class="contenedor">
        <div class="plan-badge" th:text="'Plan seleccionado: ' + ${plan}"></div>
        <div class="opciones">
            <a th:href="@{/login(plan=${plan})}" class="tarjeta">
                <h2>Iniciar Sesión</h2>
                <div class="separador"></div>
                <p>Ya tengo una cuenta en Vortex y quiero acceder con mis credenciales.</p>
            </a>
            <a th:href="@{/registro(plan=${plan})}" class="tarjeta">
                <h2>Registrarse</h2>
                <div class="separador"></div>
                <p>Soy nuevo en Vortex y quiero crear una cuenta con el plan seleccionado.</p>
            </a>
        </div>
    </main>
    <footer>En Vortex nos preocupamos por tu seguridad</footer>
</body>
</html>

services:

  mysql:
    image: mysql:8.0
    container_name: vortex-mysql
    restart: always
    environment:
      MYSQL_DATABASE: vortex
      MYSQL_USER: vortex
      MYSQL_PASSWORD: toor
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./bbdd.sql:/docker-entrypoint-initdb.d/bbdd.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "vortex", "-ptoor"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: vortex-app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/vortex
      SPRING_DATASOURCE_USERNAME: vortex
      SPRING_DATASOURCE_PASSWORD: toor
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect

  nginx:
    image: nginx:alpine
    container_name: vortex-nginx
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certs:/etc/nginx/certs

volumes:
  mysql_data:

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex - Acceso</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Georgia', 'Garamond', serif; background-color: #2c3e50; min-height: 100vh; display: flex; flex-direction: column; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 30px 60px; background-color: #1a252f; }
        .logo { width: 120px; height: auto; }
        .volver { font-size: 18px; color: #e8e8d8; text-decoration: none; font-weight: bold; transition: color 0.3s; }
        .volver:hover { color: #c9a961; }
        .contenedor { flex: 1; display: flex; justify-content: center; align-items: center; padding: 60px 20px; gap: 40px; flex-wrap: wrap; flex-direction: column; }
        .plan-badge { background-color: #1a252f; color: #e8e8d8; padding: 8px 24px; border-radius: 20px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .opciones { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; }
        .tarjeta { background-color: #e8e8d8; border: 3px solid #1a252f; border-radius: 25px; padding: 50px 40px; width: 300px; display: flex; flex-direction: column; align-items: center; gap: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: all 0.4s ease; text-decoration: none; }
        .tarjeta:hover { transform: scale(1.05); border-color: #c9a961; box-shadow: 0 15px 40px rgba(0,0,0,0.5); }
        .tarjeta h2 { font-size: 22px; color: #1a252f; text-transform: uppercase; letter-spacing: 2px; text-align: center; }
        .separador { width: 100%; height: 2px; background: linear-gradient(to right, transparent, #1a252f 20%, #1a252f 80%, transparent); }
        .tarjeta p { font-size: 14px; color: #2c3e50; text-align: center; font-style: italic; line-height: 1.8; }
        footer { text-align: center; padding: 30px 20px; font-size: 18px; font-weight: bold; color: #e8e8d8; background-color: #1a252f; }
    </style>
</head>
<body>
    <header>
        <img src="/logo.png" alt="" class="logo">
        <a href="/" class="volver">← Volver a planes</a>
    </header>
    <main class="contenedor">
        <div class="plan-badge" th:text="'Plan seleccionado: ' + ${plan}"></div>
        <div class="opciones">
            <a th:href="@{/login(plan=${plan})}" class="tarjeta">
                <h2>Iniciar Sesión</h2>
                <div class="separador"></div>
                <p>Ya tengo una cuenta en Vortex y quiero acceder con mis credenciales.</p>
            </a>
            <a th:href="@{/registro(plan=${plan})}" class="tarjeta">
                <h2>Registrarse</h2>
                <div class="separador"></div>
                <p>Soy nuevo en Vortex y quiero crear una cuenta con el plan seleccionado.</p>
            </a>
        </div>
    </main>
    <footer>En Vortex nos preocupamos por tu seguridad</footer>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex - Planes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Garamond', serif;
            background-color: #2c3e50;
            padding: 0;
            margin: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 60px;
            margin-bottom: 0;
            background-color: #1a252f;
        }

        .logo {
            width: 120px;
            height: auto;
        }

        .contacto {
            font-size: 22px;
            color: #e8e8d8;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .contacto:hover {
            color: #c9c9ba;
        }

        .planes-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            padding: 80px 20px;
            flex-wrap: wrap;
        }

        .plan {
            background-color: #e8e8d8;
            border: 3px solid #1a252f;
            border-radius: 25px;
            padding: 40px 0;
            width: 320px;
            min-height: 520px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.4s ease;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .planes-container:hover .plan:not(:hover) {
            transform: scale(0.90);
            opacity: 0.6;
        }

        .plan:hover {
            transform: scale(1.10);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            opacity: 1;
            border-color: #c9a961;
            background-color: #f0f0e0;
        }

        .plan-titulo {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 0;
            padding: 0 30px 25px 30px;
            letter-spacing: 2px;
            border-bottom: 2px solid #1a252f;
            text-transform: uppercase;
            color: #1a252f;
        }

        .separador {
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, transparent, #1a252f 20%, #1a252f 80%, transparent);
            margin: 25px 0;
        }

        .prestaciones {
            font-size: 17px;
            line-height: 2;
            text-align: center;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 35px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            color: #2c3e50;
            font-style: italic;
        }

        .precio {
            font-size: 26px;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
            padding: 0 30px 10px 30px;
            color: #1a252f;
            letter-spacing: 1px;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            font-size: 20px;
            font-weight: bold;
            color: #e8e8d8;
            letter-spacing: 0.5px;
            background-color: #1a252f;
        }
    </style>
</head>
<body>
    <header>
        <img src="logo.png" alt="" class="logo">
        <a href="contacto.html" class="contacto">Contáctanos</a>
    </header>

    <main class="planes-container">
        <div class="plan" onclick="window.location.href='/auth?plan=free'">
            <h2 class="plan-titulo">PLAN GRATUITO</h2>
            <div class="prestaciones">Prestaciones</div>
            <div class="separador"></div>
            <p class="precio">Precio</p>
        </div>

        <div class="plan" onclick="window.location.href='/auth?plan=standard'">
            <h2 class="plan-titulo">PLAN ESTÁNDAR</h2>
            <div class="prestaciones">Prestaciones</div>
            <div class="separador"></div>
            <p class="precio">Precio</p>
        </div>

        <div class="plan" onclick="window.location.href='/auth?plan=premium'">
            <h2 class="plan-titulo">PLAN PREMIUM</h2>
            <div class="prestaciones">Prestaciones</div>
            <div class="separador"></div>
            <p class="precio">Precio</p>
        </div>
    </main>

    <footer>
        En Vortex nos preocupamos por tu seguridad
    </footer>
</body>
